version: "2"

linters:
  settings:
    errcheck:
      # Writes to the CLI's own stdout/stderr. There is nothing to do with the
      # error — reporting a failed write to the stream that just failed is
      # circular, and the process exit code already carries the outcome.
      #
      # This is the ONLY errcheck exclusion, and the four sibling lookup tools
      # carry the same one. Everything else stays on deliberately: an unchecked
      # Close on a file this tool wrote is a real defect class — `Engine.writeFileAtomic` checks the
      # Close before the rename, and without that check a truncated entry would
      # be renamed into place while the write reported success.
      #
      # The exclusion matches by function name, not by destination. Every
      # fmt.Fprint* call in this repository writes to the stdout/stderr that
      # app.Run was handed; do not use fmt.Fprint* to write a file.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
